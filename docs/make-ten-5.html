<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趣学数学 - 思维演练场</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#4F46E5',
                        'success': '#10B981',
                        'wrong': '#EF4444',
                    }
                }
            }
        }
    </script>
    <style>
        /* 强制显示边框，增强“坑位”感 */
        .input-box {
            @apply w-12 h-12 text-center text-2xl font-bold border-2 border-blue-400 rounded-lg bg-white shadow-inner focus:outline-none focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 transition-all;
            -moz-appearance: textfield;
        }
        .input-box::-webkit-inner-spin-button, .input-box::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* 状态颜色 */
        .input-box.correct { @apply border-success bg-green-50 text-success ring-0; }
        .input-box.incorrect { @apply border-wrong bg-red-50 text-wrong ring-0; }

        /* 辅助线样式 */
        .path-line { @apply border-gray-400 border-dashed; }
        
        .math-symbol { @apply text-xl font-black text-gray-500 bg-gray-100 w-6 h-6 flex items-center justify-center rounded-full; }
    </style>
</head>
<body class="bg-indigo-50 min-h-screen flex flex-col items-center p-4 font-sans">

    <header class="w-full max-w-md bg-white rounded-2xl shadow-md p-4 mb-6 flex justify-between items-center border-b-4 border-indigo-200">
        <div>
            <h1 class="text-xl font-black text-indigo-600 tracking-wider">🌟 凑/破/平十法</h1>
            <p class="text-xs text-gray-400 font-bold uppercase">Math Practice v2.0</p>
        </div>
        <div class="bg-indigo-600 text-white px-4 py-1 rounded-full shadow-lg">
            <span class="text-xs opacity-80">得分</span>
            <span id="score" class="text-xl font-mono font-bold ml-1">0</span>
        </div>
    </header>

    <div class="flex space-x-2 mb-6 w-full max-w-md bg-white p-1.5 rounded-2xl shadow-sm border border-indigo-100">
        <button onclick="switchMode('makeTen')" id="btn-makeTen" class="flex-1 py-3 rounded-xl text-sm font-bold transition-all bg-indigo-600 text-white">凑十法</button>
        <button onclick="switchMode('breakTen')" id="btn-breakTen" class="flex-1 py-3 rounded-xl text-sm font-bold transition-all text-gray-500 hover:bg-indigo-50">破十法</button>
        <button onclick="switchMode('flatTen')" id="btn-flatTen" class="flex-1 py-3 rounded-xl text-sm font-bold transition-all text-gray-500 hover:bg-indigo-50">平十法</button>
    </div>

    <main class="w-full max-w-md bg-white rounded-[2rem] shadow-xl p-8 border-2 border-white relative min-h-[450px] flex flex-col items-center">
        
        <div id="exercise-container" class="w-full h-full flex flex-col items-center">
            </div>

        <div class="mt-auto w-full text-center">
            <div id="feedback-msg" class="h-8 mb-4 font-bold text-lg"></div>
            <button onclick="generateQuestion()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black text-xl shadow-[0_6px_0_0_#4338ca] active:shadow-none active:translate-y-1 transition-all">
                下一题 NEXT ➔
            </button>
        </div>
    </main>

    <p class="mt-8 text-indigo-300 text-xs font-bold">💡 提示：在蓝色框框里填入正确的数字吧！</p>

    <script>
        let currentMode = 'makeTen';
        let score = 0;
        let answers = {};

        function switchMode(mode) {
            currentMode = mode;
            ['makeTen', 'breakTen', 'flatTen'].forEach(m => {
                const btn = document.getElementById(`btn-${m}`);
                if(m === mode) {
                    btn.className = "flex-1 py-3 rounded-xl text-sm font-bold transition-all bg-indigo-600 text-white shadow-md";
                } else {
                    btn.className = "flex-1 py-3 rounded-xl text-sm font-bold transition-all text-gray-500 hover:bg-indigo-50";
                }
            });
            generateQuestion();
        }

        function generateQuestion() {
            const container = document.getElementById('exercise-container');
            const feedback = document.getElementById('feedback-msg');
            feedback.innerText = '';
            container.innerHTML = '';
            
            if (currentMode === 'makeTen') {
                renderMakeTen(container);
            } else if (currentMode === 'breakTen') {
                renderBreakTen(container);
            } else {
                renderFlatTen(container);
            }
        }

        // 凑十法渲染
        function renderMakeTen(container) {
            const a = Math.floor(Math.random() * 3) + 7; // 7, 8, 9
            const b = Math.floor(Math.random() * 5) + (11 - a); // 确保和 > 10
            const b1 = 10 - a;
            const b2 = b - b1;
            answers = { b1, b2, res: a + b };

            container.innerHTML = `
                <div class="flex items-center text-4xl font-black text-gray-800 mb-12">
                    <span>${a}</span><span class="mx-3 text-indigo-400">+</span><span>${b}</span><span class="mx-3 text-gray-300">=</span>
                    <input type="number" id="res" class="input-box w-20 h-16 text-3xl" oninput="check()">
                </div>
                <div class="relative w-64 h-40">
                    <div class="absolute top-0 right-12 w-16 h-8 border-l-2 border-r-2 border-gray-300 rounded-t-lg"></div>
                    <div class="absolute top-8 left-28 flex space-x-8">
                        <input type="number" id="b1" class="input-box" placeholder="?" oninput="check()">
                        <input type="number" id="b2" class="input-box" placeholder="?" oninput="check()">
                    </div>
                    <div class="absolute top-10 left-4 w-28 h-20 border-l-2 border-b-2 path-line rounded-bl-3xl"></div>
                    <div class="absolute top-24 left-16 flex items-center">
                        <span class="math-symbol">+</span>
                        <div class="ml-12 font-black text-2xl text-indigo-600 bg-indigo-50 px-3 py-1 rounded-lg border-2 border-indigo-200">10</div>
                    </div>
                    <div class="absolute top-32 right-10 flex flex-col items-center">
                        <div class="h-6 border-l-2 path-line"></div>
                        <span class="math-symbol">+</span>
                    </div>
                </div>
            `;
        }

        // 破十法渲染
        function renderBreakTen(container) {
            const a_unit = Math.floor(Math.random() * 5) + 1; // 1-5
            const a = 10 + a_unit;
            const b = Math.floor(Math.random() * 4) + (a_unit + 1); // 确保需要退位
            const b1 = a_unit;
            const b2 = 10;
            const b3 = 10 - b;
            answers = { b1, b2, b3, res: a - b };

            container.innerHTML = `
                <div class="flex items-center text-4xl font-black text-gray-800 mb-12">
                    <span>${a}</span><span class="mx-3 text-pink-400">-</span><span>${b}</span><span class="mx-3 text-gray-300">=</span>
                    <input type="number" id="res" class="input-box w-20 h-16 text-3xl" oninput="check()">
                </div>
                <div class="relative w-64 h-48">
                    <div class="absolute top-0 left-6 w-16 h-8 border-l-2 border-r-2 border-gray-300 rounded-t-lg"></div>
                    <div class="absolute top-8 left-0 flex space-x-8">
                        <input type="number" id="b1" class="input-box border-gray-200" placeholder="个位" oninput="check()">
                        <input type="number" id="b2" class="input-box border-indigo-400" placeholder="10" oninput="check()">
                    </div>
                    <div class="absolute top-10 right-4 w-12 h-16 border-r-2 border-b-2 path-line rounded-br-3xl"></div>
                    <div class="absolute top-20 right-10 flex flex-col items-center">
                        <span class="math-symbol">-</span>
                        <input type="number" id="b3" class="input-box mt-2" placeholder="减" oninput="check()">
                    </div>
                    <div class="absolute top-40 left-12 w-24 h-6 border-l-2 border-b-2 path-line rounded-bl-xl"></div>
                    <div class="absolute top-36 left-20">
                         <span class="math-symbol">+</span>
                    </div>
                </div>
            `;
        }

        // 平十法渲染
        function renderFlatTen(container) {
            const a_unit = Math.floor(Math.random() * 5) + 2; // 2-6
            const a = 10 + a_unit;
            const b = Math.floor(Math.random() * 3) + (a_unit + 1); 
            const b1 = a_unit;
            const b2 = b - a_unit;
            answers = { b1, b2, res: a - b };

            container.innerHTML = `
                <div class="flex items-center text-4xl font-black text-gray-800 mb-12">
                    <span>${a}</span><span class="mx-3 text-orange-400">-</span><span>${b}</span><span class="mx-3 text-gray-300">=</span>
                    <input type="number" id="res" class="input-box w-20 h-16 text-3xl" oninput="check()">
                </div>
                <div class="relative w-64 h-40">
                    <div class="absolute top-0 right-12 w-16 h-8 border-l-2 border-r-2 border-gray-300 rounded-t-lg"></div>
                    <div class="absolute top-8 left-28 flex space-x-8">
                        <input type="number" id="b1" class="input-box" oninput="check()">
                        <input type="number" id="b2" class="input-box" oninput="check()">
                    </div>
                    <div class="absolute top-10 left-4 w-28 h-20 border-l-2 border-b-2 path-line rounded-bl-3xl"></div>
                    <div class="absolute top-24 left-16 flex items-center">
                        <span class="math-symbol">-</span>
                        <div class="ml-12 font-black text-2xl text-orange-600 bg-orange-50 px-3 py-1 rounded-lg border-2 border-orange-200">10</div>
                    </div>
                    <div class="absolute top-32 right-10 flex flex-col items-center">
                        <div class="h-6 border-l-2 path-line"></div>
                        <span class="math-symbol">-</span>
                    </div>
                </div>
            `;
        }

        function check() {
            const inputs = document.querySelectorAll('.input-box');
            let allFilled = true;
            let allCorrect = true;

            inputs.forEach(input => {
                const val = parseInt(input.value);
                if (isNaN(val)) {
                    allFilled = false;
                    input.classList.remove('correct', 'incorrect');
                } else {
                    if (val === answers[input.id]) {
                        input.classList.add('correct');
                        input.classList.remove('incorrect');
                    } else {
                        input.classList.add('incorrect');
                        input.classList.remove('correct');
                        allCorrect = false;
                    }
                }
            });

            if (allFilled && allCorrect) {
                document.getElementById('feedback-msg').innerHTML = '<span class="text-success text-2xl animate-bounce inline-block">🎉 太棒了！</span>';
                score += 10;
                document.getElementById('score').innerText = score;
            }
        }

        // 初始生成
        generateQuestion();
    </script>
</body>
</html>
